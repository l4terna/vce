spring:
  application:
    name: flux

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/flux?reWriteBatchedInserts=true
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC

  data:
    redis:
      password: redis
      host: localhost
      port: 6380

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      batch-size: 25000 # 0.025 MB
      buffer-memory: 33554432 # 32 MB
      properties:
        linger.ms: 5
    consumer:
      enable-auto-commit: true
      auto-commit-interval: 1000
      auto-offset-reset: latest
      max-poll-records: 500

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:63342

jwt:
  secret: 
  access:
    expiration: 8640000
  refresh:
    expiration: 8640000
