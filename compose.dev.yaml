services:
  database:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=flux
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spring-network

  redis_c:
    container_name: redis
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=redis
    command: sh -c 'redis-server 
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes 
      --notify-keyspace-events Ex'
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: